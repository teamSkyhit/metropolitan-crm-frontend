[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  BACKEND_INTERNAL_URL = "https://metropolitan-staging-1d6f.up.railway.app"

[[redirects]]
  from = "/api/v1/*"
  to = "https://metropolitan-staging-1d6f.up.railway.app/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://metropolitan-staging-1d6f.up.railway.app/uploads/:splat"
  status = 200
  force = true

# Dynamic [id] routes: serve the placeholder shell so the client-side JS can read
# the real ID from useParams() and fetch the correct data at runtime.
# Static sub-routes (e.g. /brands/new) are matched first by Netlify because they
# exist as real files in the publish dir, so they are NOT affected by these rules.
[[redirects]]
  from = "/brands/:id"
  to = "/brands/placeholder.html"
  status = 200

[[redirects]]
  from = "/categories/:id"
  to = "/categories/placeholder.html"
  status = 200

[[redirects]]
  from = "/products/:id"
  to = "/products/placeholder.html"
  status = 200

[[redirects]]
  from = "/enquiries/:id"
  to = "/enquiries/placeholder.html"
  status = 200

[[redirects]]
  from = "/homepage/:id"
  to = "/homepage/placeholder.html"
  status = 200

# SPA fallback: serve index.html for any other route not matched above
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
